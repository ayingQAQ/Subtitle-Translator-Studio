[project]
name = "subtitle-translator-mvp"
version = "0.1.0"
description = "Local Streamlit app for translating existing subtitle files."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer>=3.4.4",
    "httpx>=0.28.1",
    "openai>=1.0.0",
    "pysubs2>=1.8.0",
    "python-dotenv>=1.1.1",
    "streamlit>=1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_translator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
